<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradasi Biru -> Hijau -> Kuning -> Orange -->
    <linearGradient id="gradInbox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />   <!-- Biru -->
      <stop offset="35%" stop-color="#10b981" />  <!-- Hijau -->
      <stop offset="70%" stop-color="#f59e0b" />  <!-- Kuning -->
      <stop offset="100%" stop-color="#ea580c" /> <!-- Orange -->
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Corner (Standar Icon Aplikasi HP) -->
  <rect width="512" height="512" rx="112" fill="url(#gradInbox)" />
  
  <!-- Form/Ikon Inbox (Putih Minimalis) -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Badan Kotak Inbox -->
    <path d="M96 140h320v232a32 32 0 0 1-32 32H128a32 32 0 0 1-32-32V140z" />
    
    <!-- Bukaan Depan Inbox (Tray Cutout) -->
    <path d="M96 260h96a32 32 0 0 0 32 32h64a32 32 0 0 0 32-32h96" />
    
    <!-- Panah Masuk (Inbox Arrow) -->
    <path d="M256 100v110" />
    <path d="M206 160l50 50 50-50" />
  </g>
</svg>
